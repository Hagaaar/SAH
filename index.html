<style>

  :root {
    --sans: 'Inter', -apple-system, system-ui, sans-serif;
    --anas: #FFD0A0;
    --hicham: #9AF5CC;
    --saad: #AADDFF;
    --win: #86F5AE;
    --loss: #FFAAAA;
    --gold: #FFEF9C;
    --bg-dark: #0C0C0F;
    --card-bg: #1C1C1F;
    --card-border: rgba(255,255,255,0.07);
    --text-primary: #F2F2F7;
    --text-secondary: rgba(242,242,247,0.80);
    --text-tertiary: rgba(242,242,247,0.55);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { background: var(--bg-dark); }
  body {
    font-family: var(--sans);
    font-variant-numeric: tabular-nums;
    color: var(--text-primary);
    font-size: 13px;
    min-height: 100vh;
    max-width: 390px;
    margin: 0 auto;
    padding: 20px 16px 100px;

  ::-webkit-scrollbar { width: 4px; height: 4px; }
  ::-webkit-scrollbar-thumb { background: rgba(255,255,255,.12); border-radius: 4px; }
  input[type=number]::-webkit-outer-spin-button, input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  input[type=number], input[type=password], input[type=text] { -moz-appearance: textfield; }
  button { font-family: var(--sans); cursor: pointer; border: none; background: none; color: inherit; }

  .mono { font-family: var(--sans); }
  .sectitle { font-family: var(--sans); font-size: 11px; font-weight: 600; letter-spacing: .18em; color: var(--text-tertiary); text-transform: uppercase; margin-bottom: 10px; padding-bottom: 6px; border-bottom: 1px solid rgba(255,255,255,.06); }
  .card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 16px; }

  .edt { cursor: pointer; border-bottom: 1px dotted rgba(255,255,255,.15); user-select: none; display: inline-block; min-width: 18px; }
  .edt:hover { border-bottom-color: rgba(255,255,255,.4); }
  .editinput {
    font-family: var(--sans);
    font-size: inherit;
    font-weight: 500;
    color: inherit;
    background: transparent;
    border: none;
    border-bottom: 1px solid currentColor;
    outline: none;
    text-align: center;
    width: 5.5em;
  }
  .editinput.sm { width: 4em; }

  .header-container { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px; width: 100%; }
  header h1 { font-family: var(--sans); font-size: 22px; font-weight: 700; letter-spacing: -.03em; line-height: 1; }

  .sync-badge {
    display: flex;
    align-items: center;
    gap: 6px;
    background: transparent;
    border: none;
    padding: 6px 0;
    font-family: var(--sans);
    font-size: 9px;
    font-weight: 500;
    text-transform: uppercase;
    color: var(--text-tertiary);
    cursor: pointer;
    transition: opacity 0.2s ease;
  }
  .sync-badge:active { opacity: 0.6; }
  .sync-dot { width: 10px; height: 10px; border-radius: 50%; background: rgba(255,255,255,.2); transition: background 0.4s ease, box-shadow 0.4s ease; }

  /* ── iOS 2026 TAB BAR ── */
  #tab-bar {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    width: min(368px, calc(100vw - 24px));
    display: flex;
    flex-direction: column;
    align-items: stretch;
    background: rgba(24, 24, 28, 0.55);
    backdrop-filter: blur(48px) saturate(250%);
    -webkit-backdrop-filter: blur(48px) saturate(250%);
    border-radius: 26px; /* Matched highlight radius */
    padding: 0;
    z-index: 1000;
    box-shadow: 0 24px 48px rgba(0,0,0,0.6),

  #tab-row {
    display: flex;
    align-items: center;
    padding: 6px;

  #tab-highlight {
    position: absolute;

    transition: transform 0.4s cubic-bezier(0.3, 0.8, 0.2, 1), width 0.4s cubic-bezier(0.3, 0.8, 0.2, 1);

    pointer-events: none;
    z-index: 0;

    padding: 13px 0;

    background: none;

    position: relative;

  .saisie-onglets button {
    flex: 1;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--text-secondary);
    font-weight: 600;
    padding: 16px 0;
    background: transparent;
    border: none;
    cursor: pointer;
    position: relative;

  .saisie-onglets button.active-tab {

    color: var(--tab-color) !important;
    border-radius: 0 0 16px 16px;
  }

    content: "";
    position: absolute;
    top: 0;
    width: 16px;
    height: 16px;
    pointer-events: none;

    left: -16px;
    background: radial-gradient(circle at 0 100%, transparent 16px, var(--tab-bg) 16.5px);

  .saisie-onglets button.active-tab::after {
    right: -16px;
    background: radial-gradient(circle at 100% 100%, transparent 16px, var(--tab-bg) 16.5px);
  }

  .saisie-onglets button:first-child.active-tab::before { display: none; }
  .saisie-onglets button:last-child.active-tab::after { display: none; }

  .saisie-bloc {
    background: var(--tab-bg);

    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    position: relative;

  .saisie-input-bg {
    background: rgba(255,255,255,0.07);
    border: none;
    border-radius: 12px;

  /* ── PIN DOTS ── */
  .pin-dot {
    width:14px; height:14px; border-radius:50%;
    border:1.5px solid rgba(255,255,255,.28); background:transparent;
    transition: border-color 0.15s;
  }
  @keyframes dot-pop {
    0%   { transform:scale(0);   opacity:0 }
    55%  { transform:scale(1.4); opacity:1 }
    100% { transform:scale(1);   opacity:1 }
  }
  @keyframes dot-success {
    0%   { transform:scale(1) }
    40%  { transform:scale(1.55) }
    100% { transform:scale(1) }
  }
  .pin-dot.filled {
    background:var(--text-primary); border-color:var(--text-primary);
    animation: dot-pop 0.32s cubic-bezier(0.34,1.56,0.64,1) forwards;
  }
  .pin-dot.success {
    background:var(--win); border-color:var(--win);
    animation: dot-success 0.4s cubic-bezier(0.34,1.56,0.64,1) both;
  }
  .pin-dot.success:nth-child(1){animation-delay:.00s}
  .pin-dot.success:nth-child(2){animation-delay:.06s}
  .pin-dot.success:nth-child(3){animation-delay:.12s}
  .pin-dot.success:nth-child(4){animation-delay:.18s}
  .pin-dot.success:nth-child(5){animation-delay:.24s}
  .pin-dot.error { background:var(--loss); border-color:var(--loss); }

  /* ── PIN KEYS ── */
  .pin-key {
    width:76px; height:76px; border-radius:50%;
    border:1px solid rgba(255,255,255,.12); background:rgba(255,255,255,.07);
    color:var(--text-primary); font-size:26px; font-family:var(--sans); font-weight:300;
    cursor:pointer; display:flex; align-items:center; justify-content:center;
    -webkit-tap-highlight-color:transparent; user-select:none;
    transition: background 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease, transform 0.3s ease;
    will-change: transform;
  }
  @keyframes key-tap {
    0%   { transform:scale(1) }
    30%  { transform:scale(0.82); background:rgba(255,208,160,.28); box-shadow:0 0 24px rgba(255,208,160,.5), inset 0 0 10px rgba(255,208,160,.2); border-color:rgba(255,208,160,.6); }
    100% { transform:scale(1) }
  }
  .pin-key.tapped { animation: key-tap 0.28s cubic-bezier(0.34,1.3,0.64,1) forwards; }
  .pin-key.del { font-size:20px; color:var(--text-secondary); border:none; background:transparent; }
  @keyframes del-tap { 0%{transform:scale(1)} 35%{transform:scale(0.78)} 100%{transform:scale(1)} }
  .pin-key.del.tapped { animation: del-tap 0.22s cubic-bezier(0.34,1.4,0.64,1) forwards; background:transparent; box-shadow:none; }

  /* ── SHAKE / ERROR ── */
  @keyframes shake {
    0%,100%{ transform:translateX(0)   scale(1)   }
    15%     { transform:translateX(-11px) scale(1.04) }
    35%     { transform:translateX(11px)  scale(1.04) }
    55%     { transform:translateX(-8px)  scale(1.02) }
    75%     { transform:translateX(8px)   scale(1.02) }
  }
  .shake { animation:shake 0.42s cubic-bezier(0.36,0.07,0.19,0.97) both; }
  @keyframes error-flash { 0%,100%{background:transparent} 45%{background:rgba(255,80,80,.07)} }
  .error-flash { animation: error-flash 0.5s ease; }

  /* ── MISC ── */
  @keyframes pin-pulse { 0%,100%{transform:scale(1);opacity:1} 50%{transform:scale(1.5);opacity:0.4} }
  .pin-dot.loading {

  .pin-dot.loading:nth-child(3){animation-delay:.3s}
  .pin-dot.loading:nth-child(4){animation-delay:.45s}
  .pin-dot.loading:nth-child(5){animation-delay:.6s}

  @keyframes label-enter { from{opacity:0;letter-spacing:.6em} to{opacity:1;letter-spacing:.28em} }
  @keyframes dots-enter  { from{opacity:0;transform:translateY(-10px)} to{opacity:1;transform:translateY(0)} }
  @keyframes key-enter   { from{opacity:0;transform:scale(0.5)} to{opacity:1;transform:scale(1)} }

  #auth-overlay {
    position: fixed; inset: 0; background: var(--bg-dark); z-index: 9999;
    display: flex; align-items: center; justify-content: center;
    animation: overlay-in 0.5s ease both;
  }
  #auth-overlay.out { animation: auth-fade-out 0.5s cubic-bezier(0.4,0,0.2,1) forwards; }

  #auth-card {
    display: flex; flex-direction: column; align-items: center; gap: 44px;
    animation: card-enter 0.7s cubic-bezier(0.22,1,0.36,1) 0.05s both;
  }
  #auth-label {
    font-size: 12px; font-weight: 600; letter-spacing: .28em; text-transform: uppercase;
    color: var(--text-tertiary);
    animation: label-enter 1s ease 0.15s both;
  }
  #auth-dots {
    display: flex; gap: 16px;
    animation: dots-enter 0.6s ease 0.25s both;
  }
  #auth-pad {
    display: grid; grid-template-columns: repeat(3, 76px); gap: 16px;
  }
  #auth-pad .pin-key:not(.ghost) {
    animation: key-enter 0.55s cubic-bezier(0.34,1.56,0.64,1) both;
  }
  #auth-pad .pin-key:nth-child(1){animation-delay:.18s}
  #auth-pad .pin-key:nth-child(2){animation-delay:.22s}
  #auth-pad .pin-key:nth-child(3){animation-delay:.26s}
  #auth-pad .pin-key:nth-child(4){animation-delay:.30s}
  #auth-pad .pin-key:nth-child(5){animation-delay:.34s}
  #auth-pad .pin-key:nth-child(6){animation-delay:.38s}
  #auth-pad .pin-key:nth-child(7){animation-delay:.42s}
  #auth-pad .pin-key:nth-child(8){animation-delay:.46s}
  #auth-pad .pin-key:nth-child(9){animation-delay:.50s}
  #auth-pad .pin-key:nth-child(11){animation-delay:.54s}
  #auth-pad .pin-key:nth-child(12){animation-delay:.58s}
  #auth-pad .pin-key.ghost { border:none; background:transparent; cursor:default; pointer-events:none; }
</style>

/* ── AUTH ── */
(function(){
  const HASH = 'c9f1e824ac8f66e7b43c117cb0e7fe182d3a30fe0f209345d7c47d0243e5aef5';
  const SK   = '__sah_ok';
  const ov   = document.getElementById('auth-overlay');
  if(sessionStorage.getItem(SK)==='1'){ov.style.display='none';return;}
  let buf='',done=false;
  async function digest(s){
    const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));
    return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,'0')).join('');
  }
  function dots(){
    for(let i=0;i<5;i++){
      const d=document.getElementById('ad'+i);
      if(!d)continue;
      const shouldFill=i<buf.length;
      const wasFilled=d.classList.contains('filled');
      if(shouldFill&&!wasFilled){
        d.className='pin-dot'; void d.offsetWidth; d.className='pin-dot filled';
      } else if(!shouldFill){
        d.className='pin-dot';
      }
    }
  }
  function tapKey(el){
    if(!el||el.classList.contains('ghost'))return;
    el.classList.remove('tapped'); void el.offsetWidth; el.classList.add('tapped');
    el.addEventListener('animationend',()=>el.classList.remove('tapped'),{once:true});
  }
  async function submit(){
    if(await digest(buf)===HASH){
      done=true;
      sessionStorage.setItem(SK,'1');
      document.querySelectorAll('#auth-dots .pin-dot').forEach((d,i)=>{
        setTimeout(()=>{d.className='pin-dot'; void d.offsetWidth; d.className='pin-dot success';},i*60);
      });
      setTimeout(()=>{ov.classList.add('out'); setTimeout(()=>{ov.style.display='none';},500);},520);
    } else {
      const w=document.getElementById('auth-dots');
      const card=document.getElementById('auth-card');
      document.querySelectorAll('#auth-dots .pin-dot').forEach(d=>d.classList.add('error'));
      w.classList.add('shake');
      card.classList.add('error-flash');
      setTimeout(()=>{
        w.classList.remove('shake'); card.classList.remove('error-flash');
        document.querySelectorAll('#auth-dots .pin-dot').forEach(d=>d.classList.remove('error'));
        buf=''; dots();
      },500);
    }
  }
  document.getElementById('auth-pad').addEventListener('click',e=>{
    if(done)return;
    const k=e.target.closest('[data-k]'),dl=e.target.closest('#auth-del');
    if(k&&buf.length<5){tapKey(k);buf+=k.dataset.k;dots();if(buf.length===5)submit();}
    else if(dl&&buf.length>0){tapKey(dl);buf=buf.slice(0,-1);dots();}
  });
  document.addEventListener('keydown',e=>{
    if(done||ov.style.display==='none')return;
    if(e.key>='0'&&e.key<='9'&&buf.length<5){buf+=e.key;dots();if(buf.length===5)submit();}
    else if(e.key==='Backspace'&&buf.length>0){buf=buf.slice(0,-1);dots();}
  });
})();

function makeChange(person,monthKey,kg,kcal,note){
  const pc=S.config.persons[person];
  let k2=mStep(monthKey,-1); let prevKg2=pc.startKg;
  for(let i=0;i<80;i++){if(k2<START_KEY)break;const d2=S.data[k2]&&S.data[k2][person];if(d2&&d2.kg!=null){prevKg2=d2.kg;break;}k2=mStep(k2,-1);}
  const lk=kg!=null?+(prevKg2-kg).toFixed(2):null;
  const wOk=lk!=null&&lk>=pc.targetLoss; const kOk=kcal!=null&&kcal>=pc.kcalMin;

  let pass, amount;
  if (person === 'saad') {
    if (kcal == null) { pass=null; amount=0; }
    else { pass=kOk; amount=pass?S.config.stakes.success:S.config.stakes.failure; }
  } else {
    if (kg == null) { pass=null; amount=0; }
    else { pass=wOk; amount=pass?S.config.stakes.success:S.config.stakes.failure; }
  }

  return{month:monthKey,person,kg:kg??null,kcal:kcal??null,pass,amount,note:note||'entry'};
}

/* ════ LOGIQUE MÉTIER ════ */
function prevKgFor(person,key){
  let k=mStep(key,-1);
  for(let i=0;i<80;i++){
    if(k<START_KEY)break;
    const dyn=S.data[k]&&S.data[k][person];
    if(dyn&&dyn.kg!=null)return dyn.kg;
    const sta=STATIC_HISTORY[k]&&STATIC_HISTORY[k][person];
    if(sta&&sta.kg!=null)return sta.kg;
    k=mStep(k,-1);
  }
  return S.config.persons[person].startKg;
}

function computeEntry(person,key){
  const pc = S.config.persons[person];
  if(key <= OBS_END) return {pass:true, amount:S.config.stakes.success, reason:'obs'};

  const d = (S.data[key] && S.data[key][person]) || {};
  const prevKg = prevKgFor(person,key);
  const lossKg = d.kg != null ? +(prevKg - d.kg).toFixed(2) : null;
  const wOk = lossKg != null && lossKg >= pc.targetLoss;
  const kOk = d.kcal != null && d.kcal >= pc.kcalMin;

  if (person === 'saad') {
    if (d.kcal == null) return {pass:null, amount:0, reason:'pending'};
    const pass = kOk;
    return {pass, amount: pass ? S.config.stakes.success : S.config.stakes.failure,
            reason: pass ? (d.kcal+' kcal ✓') : (d.kcal+' kcal < '+pc.kcalMin)};
  } else {
    if (d.kg == null) return {pass:null, amount:0, reason:'pending'};
    const pass = wOk;
    return {pass, amount: pass ? S.config.stakes.success : S.config.stakes.failure,
            reason: pass ? '−'+lossKg+' kg ✓' : '−'+lossKg+' kg < '+pc.targetLoss};
  }
}

function amountFor(person,key){
  const auto=computeEntry(person,key);
  if(auto.pass===null)return auto;
  const man=S.manual[key]&&S.manual[key][person];
  if(man!==undefined)return{...auto,amount:man,pass:man===S.config.stakes.success};
  return auto;
}

function displayKeys(){

  });
  return Array.from(set).sort().reverse();
}

function renderChart(field){
  const chartData={};
  Object.keys(STATIC_HISTORY).forEach(k=>{chartData[k]=STATIC_HISTORY[k];});
  Object.keys(S.data).forEach(k=>{chartData[k]=Object.assign({},chartData[k]||{},S.data[k]);});
  const keys=Object.keys(chartData).filter(k=>PERSONS.some(p=>{const d=chartData[k]&&chartData[k][p];return d&&d[field]!=null;})).sort();
  if(!keys.length)return '<div style="text-align:center;padding:24px;font-family:var(--sans);font-weight:500;font-size:11px;color:rgba(242,242,247,.58)">No data</div>';

  const W=350,H=180,ml=42,mr=32,mt=16,mb=24;
  const cW=W-ml-mr,cH=H-mt-mb;
  const n=keys.length;
  const allV=[];
  PERSONS.forEach(p=>keys.forEach(k=>{const d=chartData[k]&&chartData[k][p];if(d&&d[field]!=null)allV.push(d[field]);}));
  const vMin=Math.min(...allV),vMax=Math.max(...allV);
  const pad=(vMax-vMin)*0.15||2;
  const yLo=vMin-pad, yHi=vMax+pad;
  const xOf=i=>ml+(n>1?(i/(n-1))*cW:cW/2);
  const yOf=v=>mt+cH-((v-yLo)/(yHi-yLo))*cH;

  let s='<svg viewBox="0 0 '+W+' '+H+'" xmlns="http://www.w3.org/2000/svg" style="width:100%;display:block;overflow:visible">';

  s+='<defs>';
  PERSONS.forEach(p=>{
    s+='<linearGradient id="ag-'+p+'-'+field+'" x1="0" y1="0" x2="0" y2="1">';
    s+='<stop offset="0%" stop-color="'+P_COLOR[p]+'" stop-opacity="0.18"/>';
    s+='<stop offset="100%" stop-color="'+P_COLOR[p]+'" stop-opacity="0"/>';
    s+='</linearGradient>';
  });
  s+='</defs>';

  for(let i=0;i<=4;i++){
    const v=yLo+(yHi-yLo)*i/4, y=yOf(v);
    s+='<line x1="'+ml+'" y1="'+y.toFixed(1)+'" x2="'+(ml+cW)+'" y2="'+y.toFixed(1)+'" stroke="rgba(255,255,255,.06)" stroke-width="1"/>';
    s+='<text x="'+(ml-6)+'" y="'+(y+3).toFixed(1)+'" text-anchor="end" font-family="Inter,sans-serif" font-weight="500" font-size="9" fill="rgba(242,242,247,.72)">'+Math.round(v)+'</text>';
  }

  keys.forEach((k,i)=>{
    if(i !== 0 && i !== keys.length - 1) return;
    const x = xOf(i).toFixed(1);
    const yL = (mt + cH + 14).toFixed(1);
    const anchor = i === 0 ? 'start' : 'end';
    s+='<text x="'+x+'" y="'+yL+'" text-anchor="'+anchor+'" font-family="Inter,sans-serif" font-weight="500" font-size="9" fill="rgba(242,242,247,.72)">'+mShrt(k)+'</text>';
  });

  const labelsToDraw = [];

  PERSONS.forEach(p=>{
    const col=P_COLOR[p];
    const pts=keys.map((k,i)=>{const d=chartData[k]&&chartData[k][p];const v=d&&d[field]!=null?d[field]:null;return{x:xOf(i),y:v!=null?yOf(v):null,v,i};});

    const segs=[];let cur=[];
    pts.forEach(pt=>{if(pt.y!=null){cur.push(pt);}else{if(cur.length>1)segs.push([...cur]);cur=[];}});
    if(cur.length>1)segs.push(cur);
    segs.forEach(seg=>{
      let ap='M'+seg[0].x.toFixed(1)+' '+seg[0].y.toFixed(1);
      seg.slice(1).forEach(pt=>{ap+=' L'+pt.x.toFixed(1)+' '+pt.y.toFixed(1);});
      ap+=' L'+seg[seg.length-1].x.toFixed(1)+' '+(mt+cH).toFixed(1);
      ap+=' L'+seg[0].x.toFixed(1)+' '+(mt+cH).toFixed(1)+' Z';
      s+='<path d="'+ap+'" fill="url(#ag-'+p+'-'+field+')" />';
    });

    let path='',pr=false;
    pts.forEach(pt=>{if(pt.y!=null){path+=(pr?'L':'M')+pt.x.toFixed(1)+' '+pt.y.toFixed(1)+' ';pr=true;}else pr=false;});
    if(path)s+='<path d="'+path+'" fill="none" stroke="'+col+'" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>';

    const lastIdx=pts.reduce((li,pt,i)=>pt.y!=null?i:li,-1);
    const firstIdx=pts.findIndex(pt=>pt.y!=null);
    pts.forEach((pt,i)=>{
      if(pt.y==null)return;
      const r=n>24?2:3.5;
      s+='<circle cx="'+pt.x.toFixed(1)+'" cy="'+pt.y.toFixed(1)+'" r="'+r+'" fill="'+col+'"/>';
      if(i===lastIdx){labelsToDraw.push({type:'last',x:pt.x,y:pt.y,v:pt.v,col,i});}
      else if(i===firstIdx&&firstIdx!==lastIdx){labelsToDraw.push({type:'first',x:pt.x,y:pt.y,v:pt.v,col,i});}
    });
  });

  const cols = {};
  labelsToDraw.forEach(l => {
      if(!cols[l.i]) cols[l.i] = [];
      cols[l.i].push(l);
  });

  Object.values(cols).forEach(colLabels => {
      colLabels.sort((a,b) => a.y - b.y);
      const MIN_DIST = 11;
      for(let iter=0; iter<5; iter++) {
          for(let j=1; j<colLabels.length; j++) {
              const diff = colLabels[j].y - colLabels[j-1].y;
              if(diff < MIN_DIST) {
                  const overlap = MIN_DIST - diff;
                  colLabels[j-1].y -= overlap / 2;
                  colLabels[j].y += overlap / 2;
              }
          }
      }
      colLabels.forEach(l => {
          if(l.type === 'first') {
              s+='<text x="'+(l.x - 6).toFixed(1)+'" y="'+(l.y + 3).toFixed(1)+'" text-anchor="end" font-family="Inter,sans-serif" font-weight="600" font-size="9" fill="'+l.col+'">'+l.v+'</text>';
          } else {
              s+='<text x="'+(l.x + 6).toFixed(1)+'" y="'+(l.y + 3).toFixed(1)+'" font-family="Inter,sans-serif" font-weight="600" font-size="9" fill="'+l.col+'">'+l.v+'</text>';
          }
      });
  });

  return s+'</svg>';
}

let _lastTab = null;

function updateTabHighlight(){
  const bar    = document.getElementById('tab-bar');
  const tabRow = document.getElementById('tab-row');
  const hl     = document.getElementById('tab-highlight');
  if(!bar || !hl) return;

  bar.querySelectorAll('.tab').forEach(btn=>{
    btn.classList.toggle('on', btn.getAttribute('data-val')===S.tab);
  });

  const tabs  = Array.from(bar.querySelectorAll('.tab'));
  const idx   = tabs.findIndex(t=>t.getAttribute('data-val')===S.tab);
  const rowEl = tabRow || bar;
  if(idx<0 || rowEl.clientWidth===0) return;

  const pad    = 6;
  const innerW = rowEl.clientWidth - pad*2;
  const tabW  = innerW / tabs.length;
  const tx    = idx * tabW;

  const animate = _lastTab !== null && _lastTab !== S.tab;
  _lastTab = S.tab;

  if(!animate){
    hl.style.transition = 'none';
    hl.style.width = tabW+'px';
    hl.style.transform = 'translateX('+tx+'px)';
    requestAnimationFrame(()=>{ hl.style.transition=''; });
  } else {
    hl.style.width = tabW+'px';
    hl.style.transform = 'translateX('+tx+'px)';
  }
}

function bindForm(){
  const kg=document.getElementById('f-kg'), kc=document.getElementById('f-kcal');
  function upd(){
    S.fKg=kg?kg.value:''; S.fKcal=kc?kc.value:'';
    const el=document.getElementById('preview');if(!el)return;
    const kgN=S.fKg?parseFloat(S.fKg.replace(',','.')):null;
    const kcN=S.fKcal?parseInt(S.fKcal):null;
    if(kgN==null&&kcN==null){el.innerHTML='';return;}
    const bak=S.data[S.formMonth];
    if(!S.data[S.formMonth])S.data[S.formMonth]={};
    S.data[S.formMonth]=Object.assign({},bak,{[S.formPerson]:{kg:kgN,kcal:kcN}});
    const e=computeEntry(S.formPerson,S.formMonth);
    S.data[S.formMonth]=bak;
    if(e.pass===null){el.innerHTML='';return;}
    el.innerHTML='<span style="color:'+(e.pass?'var(--win)':'var(--loss)')+'">+'+(e.amount)+'€</span>';
  }
  if(kg)kg.addEventListener('input',upd);
  if(kc)kc.addEventListener('input',upd);

  const tt=document.getElementById('f-trip-title'), td=document.getElementById('f-trip-dates'), tc=document.getElementById('f-trip-cost');
  if(tt) tt.addEventListener('input', () => S.fTripTitle = tt.value);
  if(td) td.addEventListener('input', () => S.fTripDates = td.value);
  if(tc) tc.addEventListener('input', () => S.fTripCost = tc.value);
}

function openInlineEdit(el, currentVal, dec, isKcal, onCommit){
  if(el.querySelector('input'))return;
  const input=document.createElement('input');
  input.type='number'; input.inputMode=isKcal?'numeric':'decimal';
  input.className='editinput'+(isKcal?' sm':'');
  input.placeholder=isKcal?'kcal':'kg';
  input.value=currentVal!=null?currentVal:'';
  el.innerHTML=''; el.appendChild(input);
  input.focus(); input.select();
  let committed=false;
  const commit=()=>{
    if(committed)return; committed=true;
    const n=parseFloat(input.value.replace(',','.'));
    onCommit(input.value.trim()===''?null:(isNaN(n)?null:+n.toFixed(dec)));
  };
  input.addEventListener('blur',commit);
  input.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();commit();}if(e.key==='Escape'){committed=true;render();}});
}

function setPath(obj,path,val){const p=path.split('.');let c=obj;for(let i=0;i<p.length-1;i++)c=c[p[i]];c[p[p.length-1]]=val;}

document.addEventListener('click',ev=>{
  const t=ev.target.closest('[data-act]');
  if(!t)return;
  const act=t.getAttribute('data-act');

  if(act==='toggle-year'){
    const yr=t.getAttribute('data-year');
    if(S.openYears.has(yr)) S.openYears.delete(yr); else S.openYears.add(yr);
    render();return;
  }

  if(act==='tab'){S.tab=t.getAttribute('data-val');S.pickerOpen=false;render();return;}
  if(act==='fperson'){S.formPerson=t.getAttribute('data-val');render();return;}

  if(act==='picker'){S.pickerOpen=!S.pickerOpen;render();return;}
  if(act==='picker-bg'){S.pickerOpen=false;render();return;}
  if(act==='pick'){S.formMonth=t.getAttribute('data-val');S.userSelectedMonth=true;S.pickerOpen=false;render();return;}

  if(act==='add'){
    const kgEl=document.getElementById('f-kg'),kcEl=document.getElementById('f-kcal');
    const kgN=kgEl&&kgEl.value?parseFloat(kgEl.value.replace(',','.')):null;
    const kcN=kcEl&&kcEl.value?parseInt(kcEl.value):null;
    if (kgN == null && kcN == null) return;

    const key=S.formMonth,p=S.formPerson;
    if(!S.data[key])S.data[key]={};
    S.data[key]=Object.assign({},S.data[key],{[p]:{kg:kgN,kcal:kcN}});
    if(S.manual[key]&&S.manual[key][p]!==undefined){delete S.manual[key][p];}
    S.fKg='';S.fKcal='';
    const ch=makeChange(p,key,kgN,kcN,'form entry');
    S.openYears.add(key.split('-')[0]);
    scheduleSave([ch]);
    render();return;
  }

  if(act==='add-trip'){
    const titleEl=document.getElementById('f-trip-title');
    const datesEl=document.getElementById('f-trip-dates');
    const costEl=document.getElementById('f-trip-cost');

    const titleVal = titleEl ? titleEl.value.trim() : '';
    const datesVal = datesEl ? datesEl.value.trim() : '';
    const costVal = costEl && costEl.value ? parseFloat(costEl.value.replace(',','.')) : null;

    if (titleVal && costVal != null) {
      if(!S.trips) S.trips = [];
      S.trips.push({ title: titleVal, dates: datesVal, cost: costVal });
      S.fTripTitle=''; S.fTripDates=''; S.fTripCost='';
      scheduleSave([]);
      render();
    }
    return;
  }

  if(act==='del-trip'){
    const idx = parseInt(t.getAttribute('data-idx'));
    if(S.trips && S.trips[idx] !== undefined) {
      S.trips.splice(idx, 1);
      scheduleSave([]);
      render();
    }
    return;
  }

  if(act==='toggle'){
    const key=t.getAttribute('data-month'),p=t.getAttribute('data-person');
    const e=amountFor(p,key);if(!e)return;
    const nv=e.amount===S.config.stakes.success?S.config.stakes.failure:S.config.stakes.success;
    if(!S.manual[key])S.manual[key]={};
    S.manual[key][p]=nv;
    const d=(S.data[key]&&S.data[key][p])||{};
    const ch={month:key,person:p,kg:d.kg??null,kcal:d.kcal??null,pass:nv===S.config.stakes.success,amount:nv,note:'manual override'};
    scheduleSave([ch]);
    render();return;
  }

  if(act==='editcell'){
    const key=t.getAttribute('data-month'),p=t.getAttribute('data-person'),field=t.getAttribute('data-field');
    const curStr=t.getAttribute('data-val');
    const cur=curStr!==''?parseFloat(curStr):null;
    openInlineEdit(t,cur,field==='kg'?2:0,field==='kcal',(val)=>{
      if(!S.data[key])S.data[key]={};
      if(!S.data[key][p])S.data[key][p]={kg:null,kcal:null};
      S.data[key][p][field]=val;
      const d=S.data[key][p];
      const ch=makeChange(p,key,d.kg,d.kcal,'inline edit '+field);
      scheduleSave([ch]);
      render();
    });
    return;
  }

  if(act==='editnum'){
    const path=t.getAttribute('data-path'),dec=+t.getAttribute('data-dec');
    const cur=parseFloat(t.textContent.trim());
    openInlineEdit(t,cur,dec,path.includes('kcal'),(val)=>{
      if(val!=null)setPath(S.config,path,val);
      scheduleSave([]);
      render();
    });
    return;
  }
});

["2026-06"].forEach(k=>{
  if(S.data[k]){delete S.data[k];persist();}
  if(S.manual[k]){delete S.manual[k];persist();}
});

render();
syncLoad();
</script>
