<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>S.A.H</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
  
  :root {
    --sans: 'Inter', -apple-system, system-ui, sans-serif;
    --anas: #ffb347;
    --hicham: #7ed9a0;
    --saad: #93c5fd;
    --win: #3ddc84;
    --loss: #ff4545;
    --gold: #f0c040;
    --bg-dark: #0e0e0e;
    --card-bg: #141414;
  }
  
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { background: var(--bg-dark); }
  body {
    font-family: var(--sans);
    font-variant-numeric: tabular-nums; 
    color: #e8e8e8;
    font-size: 13px;
    min-height: 100vh;
    max-width: 390px;
    margin: 0 auto;
    padding: 16px 14px 50px;
  }
  
  ::-webkit-scrollbar { width: 4px; height: 4px; }
  ::-webkit-scrollbar-thumb { background: #2a2a2a; border-radius: 2px; }
  input[type=number]::-webkit-outer-spin-button, input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  input[type=number], input[type=password], input[type=text] { -moz-appearance: textfield; }
  button { font-family: var(--sans); cursor: pointer; border: none; background: none; color: inherit; }
  
  .mono { font-family: var(--sans); }
  .sectitle { font-family: var(--sans); font-size: 9px; font-weight: 500; letter-spacing: .15em; color: #555; text-transform: uppercase; margin-bottom: 10px; padding-bottom: 6px; border-bottom: 1px solid #1c1c1c; }
  .card { background: var(--card-bg); border: 1px solid #1f1f1f; border-radius: 8px; }
  
  .edt { cursor: pointer; border-bottom: 1px dotted #2a2a2a; user-select: none; display: inline-block; min-width: 18px; }
  .edt:hover { border-bottom-color: #555; }
  .editinput { 
    font-family: var(--sans); 
    font-size: inherit; 
    font-weight: 500; 
    color: inherit; 
    background: transparent; 
    border: none; 
    border-bottom: 1px solid currentColor; 
    outline: none; 
    text-align: center; 
    width: 5.5em; 
  }
  .editinput.sm { width: 4em; }
  
  .header-container { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; width: 100%; }
  header h1 { font-family: var(--sans); font-size: 22px; font-weight: 600; letter-spacing: -.02em; line-height: 1; }
  
  .sync-badge {
    display: flex;
    align-items: center;
    gap: 6px;
    background: transparent;
    border: none;
    padding: 6px 0;
    font-family: var(--sans);
    font-size: 9px;
    font-weight: 500;
    text-transform: uppercase;
    color: #888;
    cursor: pointer;
    transition: opacity 0.2s ease;
  }
  .sync-badge:active { opacity: 0.6; }
  .sync-dot { width: 6px; height: 6px; border-radius: 50%; background: #444; transition: background 0.3s ease; box-shadow: 0 0 4px rgba(0,0,0,0.3); }
  
  .tabs { display: flex; gap: 3px; background: #111; padding: 3px; border-radius: 10px; border: 1px solid #1c1c1c; margin-bottom: 16px; }
  .tab { flex: 1; padding: 9px 0; border-radius: 8px; color: #555; font-size: 11px; font-weight: 500; letter-spacing: .06em; transition: all 0.2s ease; }
  .tab.on { background: #242424; color: #e8e8e8; font-weight: 600; }
  
  .saisie-wrapper { width: 100%; margin-bottom: 16px; margin-top: 8px; }

  .saisie-onglets {
    display: flex;
    margin-bottom: 0;
    position: relative;
    z-index: 10;
  }

  .saisie-onglets button {
    flex: 1;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: #666;
    font-weight: 600;
    padding: 16px 0;
    background: transparent;
    border: none;
    cursor: pointer;
    position: relative;
    transition: color 0.2s;
  }

  .saisie-onglets button.active-tab {
    background: var(--tab-bg);
    color: var(--tab-color) !important;
    border-radius: 16px 16px 0 0;
  }

  .saisie-onglets button.active-tab::before,
  .saisie-onglets button.active-tab::after {
    content: "";
    position: absolute;
    bottom: 0;
    width: 16px;
    height: 16px;
    pointer-events: none;
  }
  .saisie-onglets button.active-tab::before {
    left: -16px;
    background: radial-gradient(circle at 0 0, transparent 16px, var(--tab-bg) 16.5px);
  }
  .saisie-onglets button.active-tab::after {
    right: -16px;
    background: radial-gradient(circle at 100% 0, transparent 16px, var(--tab-bg) 16.5px);
  }

  .saisie-onglets button:first-child.active-tab::before { display: none; }
  .saisie-onglets button:last-child.active-tab::after { display: none; }

  .saisie-bloc {
    background: var(--tab-bg);
    border: none;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    position: relative;
    z-index: 1;
  }

  .saisie-input-bg {
    background: rgba(0, 0, 0, 0.25);
    border: none;
    border-radius: 12px;
    color: #e8e8e8;
    font-family: var(--sans);
    font-size: 14px;
    font-weight: 600;
    outline: none;
    box-sizing: border-box;
  }
  .saisie-input-bg::placeholder { color: rgba(255, 255, 255, 0.2); font-weight: 500; }

  .pin-dot { width:14px; height:14px; border-radius:50%; border:1.5px solid #555; background:transparent; transition:background 0.1s, border-color 0.1s; }
  .pin-dot.filled { background:#e8e8e8; border-color:#e8e8e8; }
  .pin-dot.error { background:var(--loss); border-color:var(--loss); }
  
  .pin-key { width:72px; height:72px; border-radius:50%; border:1px solid #2a2a2a; background:#141414; color:#e8e8e8; font-size:24px; font-family:var(--sans); font-weight: 500; cursor:pointer; display:flex; align-items:center; justify-content:center; -webkit-tap-highlight-color:transparent; user-select:none; }
  .pin-key:active { background:#242424; }
  .pin-key.del { font-size:22px; color:#888; }
  
  @keyframes shake { 0%,100%{transform:translateX(0)} 20%,60%{transform:translateX(-8px)} 40%,80%{transform:translateX(8px)} }
  .shake { animation:shake 0.35s ease; }

  @keyframes pin-pulse { 0%,100%{transform:scale(1);opacity:1} 50%{transform:scale(1.5);opacity:0.4} }
  .pin-dot.loading {
    background: #e8e8e8;
    border-color: #e8e8e8;
    animation: pin-pulse 1.1s ease-in-out infinite;
  }
  .pin-dot.loading:nth-child(1){animation-delay:0s}
  .pin-dot.loading:nth-child(2){animation-delay:.15s}
  .pin-dot.loading:nth-child(3){animation-delay:.3s}
  .pin-dot.loading:nth-child(4){animation-delay:.45s}
  .pin-dot.loading:nth-child(5){animation-delay:.6s}

  @keyframes fade-in { from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:translateY(0)} }
  .connecting-label { animation: fade-in 0.4s ease forwards; }
</style>
</head>
<body>
<div id="root"></div>

<script>
/* ════ CONFIGURATION APP SCRIPT ════ */
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbx8qVAaxyAJyYM1SNmufGlh3oc36YS_e0S_nLbcbZVug_DHIf_SYwV3QYlNPlurerU/exec';

/* ════ CONSTANTES & UTILITAIRES ════ */
const MFR=['JAN', 'FEB', 'MAR', 'APR', 'MAY', 'JUN', 'JUL', 'AUG', 'SEP', 'OCT', 'NOV', 'DEC'];
const mKey=(y,m)=>y+'-'+String(m).padStart(2,'0');
const mLbl=k=>{const[y,m]=k.split('-');return MFR[+m-1]+' '+y;};
const mShrt=k=>{const[y,m]=k.split('-');return MFR[+m-1]+' '+y;};
const mStep=(k,d)=>{let[y,m]=k.split('-').map(Number);const n=m+d;return n>12?mKey(y+1,n-12):n<1?mKey(y-1,n+12):mKey(y,n);};

const START_KEY='2025-08', OBS_END='2025-10';
const FORM_START='2026-05', FORM_END='2030-12';
const PERSONS=['anas','hicham','saad'];

const P_COLOR={anas:'#ffb347',hicham:'#7ed9a0',saad:'#93c5fd'};
const P_BG={anas:'rgba(255,179,71,.1)',hicham:'rgba(126,217,160,.1)',saad:'rgba(147,197,253,.1)'};
const P_BORD={anas:'rgba(255,179,71,.3)',hicham:'rgba(126,217,160,.3)',saad:'rgba(147,197,253,.3)'};

const FORM_MONTHS=(()=>{
  const a=[]; let k = FORM_START;
  while(k <= FORM_END) { a.push(k); k = mStep(k, 1); }
  return a;
})();

/* ════ DONNÉES PAR DÉFAUT ════ */
const DEF_CFG={
  stakes:{success:20,failure:100},
  persons:{
    anas:{name:'Anas',startKg:89.0,targetLoss:1.5,kcalMin:630,mandat:'kg'},
    hicham:{name:'Hicham',startKg:115.1,targetLoss:1.5,kcalMin:840,mandat:'kg'},
    saad:{name:'Saad',startKg:94.5,targetLoss:1.5,kcalMin:830,mandat:'kcal'},
  }
};

const DEF_DATA={
  '2025-08':{anas:{kg:89.0,kcal:null},hicham:{kg:115.1,kcal:null},saad:{kg:94.5,kcal:null}},
  '2025-09':{anas:{kg:86.4,kcal:771},hicham:{kg:112.0,kcal:760},saad:{kg:null,kcal:null}},
  '2025-10':{anas:{kg:86.2,kcal:674},hicham:{kg:109.5,kcal:780},saad:{kg:91.55,kcal:877}},
  '2025-11':{anas:{kg:null,kcal:699},hicham:{kg:109.8,kcal:859},saad:{kg:90.45,kcal:714}},
  '2025-12':{anas:{kg:89.0,kcal:574},hicham:{kg:111.6,kcal:769},saad:{kg:93.55,kcal:486}},
  '2026-01':{anas:{kg:null,kcal:631},hicham:{kg:109.2,kcal:847},saad:{kg:92.15,kcal:542}},
  '2026-02':{anas:{kg:null,kcal:648},hicham:{kg:111.3,kcal:786},saad:{kg:null,kcal:849}},
  '2026-03':{anas:{kg:null,kcal:null},hicham:{kg:112.9,kcal:769},saad:{kg:null,kcal:777}},
  '2026-04':{anas:{kg:89.3,kcal:656},hicham:{kg:112.9,kcal:891},saad:{kg:null,kcal:796}},
};

const DEF_MANUAL={'2026-01':{saad:20}};
const DEF_TRIPS=[];

/* ════ ETAT GLOBAL ════ */
const LS='getfit_v2';
function load(){try{const r=JSON.parse(localStorage.getItem(LS));if(r&&r.config&&r.data)return r;}catch(e){}return null;}
const saved=load();

function getTargetMonth(data){
  const fSet=new Set(FORM_MONTHS);
  const allKeys=Object.keys(data).filter(k=>fSet.has(k)&&PERSONS.some(p=>{const d=data[k]&&data[k][p];return d&&(d.kg!=null||d.kcal!=null);}));
  if(!allKeys.length)return FORM_START;
  return allKeys.sort().pop();
}

let S={
  tab:'suivi',
  config:saved?saved.config:JSON.parse(JSON.stringify(DEF_CFG)),
  data:saved?saved.data:JSON.parse(JSON.stringify(DEF_DATA)),
  manual:saved?saved.manual:JSON.parse(JSON.stringify(DEF_MANUAL)),
  trips:saved&&saved.trips?saved.trips:JSON.parse(JSON.stringify(DEF_TRIPS)),
  formPerson:'anas', formMonth:FORM_START, pickerOpen:false, fKg:'', fKcal:'',
  fTripTitle:'', fTripDates:'', fTripCost:'',
  pin: localStorage.getItem('getfit_pin') || '',
  pinEntry: '',
  pinLoading: false,
  authenticated: localStorage.getItem('getfit_auth') === 'true',
  openYears: new Set(),
};

if (!S.data['2025-08'] || !S.data['2025-08'].anas || S.data['2025-08'].anas.kg == null) {
  S.data['2025-08'] = {
    anas:{kg:89.0,kcal:null},
    hicham:{kg:115.1,kcal:null},
    saad:{kg:94.5,kcal:null}
  };
  persist();
}

S.formMonth = getTargetMonth(S.data);

function persist(){try{localStorage.setItem(LS,JSON.stringify({config:S.config,data:S.data,manual:S.manual,trips:S.trips}));}catch(e){}}

/* ════ SYNCHRONISATION ════ */
let syncTimer=null;

function setSyncStatus(msg, color, dotColor) {
  const elTxt = document.getElementById('sync-text');
  const elDot = document.getElementById('sync-dot');
  if (elTxt) { elTxt.textContent = msg; elTxt.style.color = color; }
  if (elDot) { elDot.style.background = dotColor; }
}

function updateDots() {
  for (let i = 0; i < 5; i++) {
    const dot = document.getElementById('d'+i);
    if(dot) {
      if (i < S.pinEntry.length) dot.classList.add('filled');
      else dot.classList.remove('filled');
    }
  }
}

async function syncLoad(){
  if (!S.pin) { S.authenticated = false; render(); return; }
  setSyncStatus('Syncing', '#888', 'var(--gold)');
  try{
    const resp = await fetch(SCRIPT_URL + '?pin=' + encodeURIComponent(S.pin), {cache:'no-store'});
    const remote = await resp.json();
    
    if (remote && remote.status === 'error') {
      S.pin = ''; S.authenticated = false; S.pinLoading = false;
      localStorage.removeItem('getfit_pin'); localStorage.removeItem('getfit_auth');
      S.pinEntry = ''; render();
      const dots = document.getElementById('pin-dots');
      if (dots) {
        dots.classList.add('shake');
        document.querySelectorAll('.pin-dot').forEach(d => d.classList.add('error'));
        setTimeout(() => {
          dots.classList.remove('shake');
          document.querySelectorAll('.pin-dot').forEach(d => d.classList.remove('error'));
        }, 600);
      }
      return;
    }
    
    if(remote && remote.data && Object.keys(remote.data).length > 0){
      S.config = remote.config || S.config; 
      S.data = remote.data; 
      S.manual = remote.manual || S.manual;
      S.trips = remote.trips || S.trips;
      
      if (!S.data['2025-08'] || !S.data['2025-08'].anas || S.data['2025-08'].anas.kg == null) {
         S.data['2025-08'] = {
           anas: {kg: 89.0, kcal: null},
           hicham: {kg: 115.1, kcal: null},
           saad: {kg: 94.5, kcal: null}
         };
         scheduleSave([]);
      }

      S.formMonth = getTargetMonth(S.data);
      persist();
    }
    
    S.authenticated = true; S.pinLoading = false; localStorage.setItem('getfit_auth', 'true');
    setSyncStatus('Synced', '#888', 'var(--win)');
    render();
  }catch(e){
    S.pinLoading = false;
    if (localStorage.getItem('getfit_auth') === 'true') {
      S.authenticated = true; render(); setSyncStatus('Sync failed', '#888', 'var(--loss)');
    } else {
      S.authenticated = false; S.pinEntry = ''; render();
      const dots = document.getElementById('pin-dots');
      if (dots) {
        dots.classList.add('shake');
        setTimeout(() => { dots.classList.remove('shake'); }, 600);
      }
    }
  }
}

async function syncSave(changes){
  setSyncStatus('Syncing', '#888', 'var(--gold)');
  try{
    await fetch(SCRIPT_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain'},
      body:JSON.stringify({pin: S.pin, state:{config:S.config,data:S.data,manual:S.manual,trips:S.trips},changes:changes||[]})});
    setSyncStatus('Synced', '#888', 'var(--win)');
  }catch(e){
    setSyncStatus('Sync failed', '#888', 'var(--loss)');
  }
}

function makeChange(person,monthKey,kg,kcal,note){
  const pc=S.config.persons[person];
  let k2=mStep(monthKey,-1); let prevKg2=pc.startKg;
  for(let i=0;i<80;i++){if(k2<START_KEY)break;const d2=S.data[k2]&&S.data[k2][person];if(d2&&d2.kg!=null){prevKg2=d2.kg;break;}k2=mStep(k2,-1);}
  const lk=kg!=null?+(prevKg2-kg).toFixed(2):null;
  const wOk=lk!=null&&lk>=pc.targetLoss; const kOk=kcal!=null&&kcal>=pc.kcalMin;
  
  let pass;
  if (person === 'saad') {
    pass = kOk; 
  } else {
    pass = (monthKey < '2025-12') ? (wOk || kOk) : wOk;
  }
  
  return{month:monthKey,person,kg:kg??null,kcal:kcal??null,pass,amount:pass?S.config.stakes.success:S.config.stakes.failure,note:note||'entry'};
}

function scheduleSave(changes){persist();clearTimeout(syncTimer);syncTimer=setTimeout(()=>syncSave(changes),800);}

/* ════ LOGIQUE MÉTIER ════ */
function prevKgFor(person,key){
  let k=mStep(key,-1);
  for(let i=0;i<80;i++){
    if(k<START_KEY)break;
    const d=S.data[k]&&S.data[k][person];
    if(d&&d.kg!=null)return d.kg;
    k=mStep(k,-1);
  }
  return S.config.persons[person].startKg;
}

function computeEntry(person,key){
  const pc = S.config.persons[person];
  if(key <= OBS_END) return {pass:true, amount:S.config.stakes.success, reason:'obs'};
  
  const d = (S.data[key] && S.data[key][person]) || {};
  const prevKg = prevKgFor(person,key);
  
  const lossKg = d.kg != null ? +(prevKg - d.kg).toFixed(2) : null; 
  const wOk = lossKg != null && lossKg >= pc.targetLoss;
  const kOk = d.kcal != null && d.kcal >= pc.kcalMin;
  
  let pass, reason;

  if (person === 'saad') {
    pass = kOk;
    reason = pass ? (d.kcal + ' kcal ✓') : ((d.kcal != null ? d.kcal : '—') + ' kcal < ' + pc.kcalMin);
  } else {
    if (key < '2025-12') {
      pass = wOk || kOk;
      reason = pass ? (wOk ? '−'+lossKg+' kg ✓' : d.kcal+' kcal ✓') : 'Failed';
    } else {
      pass = wOk;
      reason = pass ? '−'+lossKg+' kg ✓' : (lossKg != null ? '−'+lossKg+' kg < '+pc.targetLoss : 'Weight missing');
    }
  }

  return {pass, amount: pass ? S.config.stakes.success : S.config.stakes.failure, reason};
}

function amountFor(person,key){
  const auto=computeEntry(person,key);
  const man=S.manual[key]&&S.manual[key][person];
  if(man!==undefined)return{...auto,amount:man,pass:man===S.config.stakes.success};
  return auto;
}

function displayKeys(){
  const set=new Set();
  Object.keys(S.data).forEach(k=>{
    if(PERSONS.some(p=>{const d=S.data[k]&&S.data[k][p];return d&&(d.kg!=null||d.kcal!=null);}))set.add(k);
  });
  return Array.from(set).sort().reverse();
}

const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

function badge(e,key,p){
  if(!e)return '';
  if(key <= OBS_END) return '<span style="font-size:10px;color:#555;font-family:var(--sans);font-weight:600;padding:2px 4px;">OBS</span>';
  
  const c=e.pass?'var(--win)':'var(--loss)';
  const bg=e.pass?'rgba(61,220,132,.08)':'rgba(255,69,69,.08)';
  const bd=e.pass?'rgba(61,220,132,.2)':'rgba(255,69,69,.2)';
  return '<span class="mono" data-act="toggle" data-month="'+esc(key)+'" data-person="'+p+'" '+
    'style="font-size:12px;font-weight:600;cursor:pointer;user-select:none;flex-shrink:0;color:'+c+';padding:2px 7px;border-radius:4px;background:'+bg+';border:1px solid '+bd+';">'+e.amount+'€</span>';
}

function editCell(key,person,field,value){
  const isKcal=field==='kcal';
  const lbl=value!=null?esc(value)+(isKcal?' kcal':' kg'):'—';
  const col=value!=null?(isKcal?'#777':'#e8e8e8'):'#2a2a2a';
  return '<span class="edt" data-act="editcell" data-month="'+esc(key)+'" data-person="'+person+'" data-field="'+field+'" data-val="'+(value!=null?esc(value):'')+'" style="color:'+col+';font-size:11px;font-weight:500;">'+lbl+'</span>';
}

/* ════ RENDU HTML ════ */
function renderSuivi(){
  let h = '';
  const curP = S.formPerson;

  const SAISIE_ORDER = ['saad','anas','hicham'];
  let blocRadius = '16px 16px 16px 16px';
  if (curP === 'saad') blocRadius = '0 16px 16px 16px';
  if (curP === 'hicham') blocRadius = '16px 0 16px 16px';

  h+='<div class="saisie-wrapper" style="--tab-bg:'+P_BG[curP]+'; --tab-color:'+P_COLOR[curP]+'">';
  h+='<div class="saisie-onglets">';
  SAISIE_ORDER.forEach(p=>{
    const sel=p===curP;
    h+='<button data-act="fperson" data-val="'+p+'" '+(sel?'class="active-tab"':'')+'>'+S.config.persons[p].name+'</button>';
  });
  h+='</div>';

  h+='<div class="saisie-bloc" style="border-radius:'+blocRadius+';padding:14px 16px;">';
  h+='<div style="position:relative;display:flex;gap:8px;align-items:center;">';
  h+='<div style="position:relative;flex:1.4;min-width:0;">';
  h+='<button class="saisie-input-bg" data-act="picker" style="width:100%;padding:11px 10px;text-align:left;display:flex;justify-content:space-between;align-items:center;cursor:pointer;font-size:11px;white-space:nowrap;"><span style="white-space:nowrap;">'+mLbl(S.formMonth).toUpperCase()+'</span><span style="font-size:9px;color:rgba(255,255,255,.3);flex-shrink:0;margin-left:4px;">'+(S.pickerOpen?'▲':'▼')+'</span></button>';
  if(S.pickerOpen){
    h+='<div data-act="picker-bg" style="position:fixed;inset:0;z-index:98"></div>';
    h+='<div id="picker-list" style="position:absolute;top:calc(100% + 4px);left:0;right:0;z-index:99;background:#141414;border:1px solid #2a2a2a;border-radius:12px;max-height:220px;overflow-y:auto;box-shadow:0 8px 28px rgba(0,0,0,.8)">';
    FORM_MONTHS.forEach(m=>{
      const on=m===S.formMonth;

function renderChart(field){
  const keys=Object.keys(S.data).filter(k=>PERSONS.some(p=>{const d=S.data[k]&&S.data[k][p];return d&&d[field]!=null;})).sort();
  if(!keys.length)return '<div style="text-align:center;padding:24px;font-family:var(--sans);font-weight:500;font-size:11px;color:#333">No data</div>';

  const W=350,H=180,ml=42,mr=32,mt=16,mb=24;
  const cW=W-ml-mr,cH=H-mt-mb;
  const n=keys.length;
  const allV=[];
  PERSONS.forEach(p=>keys.forEach(k=>{const d=S.data[k]&&S.data[k][p];if(d&&d[field]!=null)allV.push(d[field]);}));
  const vMin=Math.min(...allV),vMax=Math.max(...allV);
  const pad=(vMax-vMin)*0.15||2;
  const yLo=vMin-pad, yHi=vMax+pad;
  const xOf=i=>ml+(n>1?(i/(n-1))*cW:cW/2);
  const yOf=v=>mt+cH-((v-yLo)/(yHi-yLo))*cH;

  let s='<svg viewBox="0 0 '+W+' '+H+'" xmlns="http://www.w3.org/2000/svg" style="width:100%;display:block;overflow:visible">';
  s+='<rect x="'+ml+'" y="'+mt+'" width="'+cW+'" height="'+cH+'" fill="#0e0e0e" rx="4"/>';

  for(let i=0;i<=4;i++){
    const v=yLo+(yHi-yLo)*i/4, y=yOf(v);
    s+='<line x1="'+ml+'" y1="'+y.toFixed(1)+'" x2="'+(ml+cW)+'" y2="'+y.toFixed(1)+'" stroke="#1d1d1d" stroke-width="1"/>';
    s+='<text x="'+(ml-6)+'" y="'+(y+3).toFixed(1)+'" text-anchor="end" font-family="Inter,sans-serif" font-weight="500" font-size="9" fill="#444">'+Math.round(v)+'</text>';
  }

  /* — Labels X : premier et dernier mois uniquement — */
  keys.forEach((k,i)=>{
    if(i !== 0 && i !== keys.length - 1) return;
    const x = xOf(i).toFixed(1);
    const yL = (mt + cH + 14).toFixed(1);
    const anchor = i === 0 ? 'start' : 'end';
    s+='<text x="'+x+'" y="'+yL+'" text-anchor="'+anchor+'" font-family="Inter,sans-serif" font-weight="500" font-size="9" fill="#555">'+mShrt(k)+'</text>';
  });

  const labelsToDraw = [];

  PERSONS.forEach(p=>{
    const col=P_COLOR[p];
    const pts=keys.map((k,i)=>{const d=S.data[k]&&S.data[k][p];const v=d&&d[field]!=null?d[field]:null;return{x:xOf(i),y:v!=null?yOf(v):null,v,i};});
    
    let path='',pr=false;
    pts.forEach(pt=>{if(pt.y!=null){path+=(pr?'L':'M')+pt.x.toFixed(1)+' '+pt.y.toFixed(1)+' ';pr=true;}else pr=false;});
    if(path)s+='<path d="'+path+'" fill="none" stroke="'+col+'" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>';
    
    const lastIdx=pts.reduce((li,pt,i)=>pt.y!=null?i:li,-1);
    const firstIdx=pts.findIndex(pt=>pt.y!=null);
    pts.forEach((pt,i)=>{
      if(pt.y==null)return;
      // Points : taille réduite quand beaucoup de données pour rester lisibles
      const r = n > 24 ? 1.5 : 3;
      s+='<circle cx="'+pt.x.toFixed(1)+'" cy="'+pt.y.toFixed(1)+'" r="'+r+'" fill="'+col+'"/>';
      
      if(i===lastIdx){
        labelsToDraw.push({ type:'last', x:pt.x, y:pt.y, v:pt.v, col:col, i:i });
      } else if(i===firstIdx && firstIdx!==lastIdx){
        labelsToDraw.push({ type:'first', x:pt.x, y:pt.y, v:pt.v, col:col, i:i });
      }
    });
  });

  const cols = {};
  labelsToDraw.forEach(l => {
      if(!cols[l.i]) cols[l.i] = [];
      cols[l.i].push(l);
  });

  Object.values(cols).forEach(colLabels => {
      colLabels.sort((a,b) => a.y - b.y);
      const MIN_DIST = 11;
      for(let iter=0; iter<5; iter++) {
          for(let j=1; j<colLabels.length; j++) {
              const diff = colLabels[j].y - colLabels[j-1].y;
              if(diff < MIN_DIST) {
                  const overlap = MIN_DIST - diff;
                  colLabels[j-1].y -= overlap / 2;
                  colLabels[j].y += overlap / 2;
              }
          }
      }
      colLabels.forEach(l => {
          if(l.type === 'first') {
              s+='<text x="'+(l.x - 6).toFixed(1)+'" y="'+(l.y + 3).toFixed(1)+'" text-anchor="end" font-family="Inter,sans-serif" font-weight="600" font-size="9" fill="'+l.col+'">'+l.v+'</text>';
          } else {
              s+='<text x="'+(l.x + 6).toFixed(1)+'" y="'+(l.y + 3).toFixed(1)+'" font-family="Inter,sans-serif" font-weight="600" font-size="9" fill="'+l.col+'">'+l.v+'</text>';
          }
      });
  });

  return s+'</svg>';
}

  h+='<header>';
  h+='<h1 style="font-size:26px;letter-spacing:-.03em;line-height:1;">S.A.H Challenge</h1>';
  h+='<div style="font-size:8px;font-weight:500;letter-spacing:.1em;color:#3a3a3a;text-transform:uppercase;margin-top:6px;">Siblings Avoiding Heart-attacks Challenge</div>';
  h+='</header>';
  h+='<button class="sync-badge" onclick="syncLoad()" style="flex-shrink:0;display:flex;align-items:center;gap:5px;">'
    +'<span id="sync-text" style="font-size:7px;letter-spacing:.1em;color:#444;">'+(localStorage.getItem('getfit_auth')==='true'?'Synced':'Offline')+'</span>'
    +'<div id="sync-dot" class="sync-dot" style="background:'+(localStorage.getItem('getfit_auth')==='true'?'var(--win)':'var(--loss)')+'"></div>'
    +'</button>';
  h+='</div>';

  h+='<div class="tabs">';
  h+='<button class="tab '+(S.tab==='suivi'?'on':'')+'" data-act="tab" data-val="suivi">Tracking</button>';
  h+='<button class="tab '+(S.tab==='evolution'?'on':'')+'" data-act="tab" data-val="evolution">Progress</button>';
  h+='<button class="tab '+(S.tab==='objectifs'?'on':'')+'" data-act="tab" data-val="objectifs">Goals</button>';
  h+='</div>';

  h+=(S.tab==='suivi')?renderSuivi():(S.tab==='evolution')?renderEvolution():renderObjectifs();
  
  h+='<footer style="margin-top:24px;text-align:center;font-family:var(--sans);font-weight:600;font-size:10px;color:#444;letter-spacing:.15em;text-transform:uppercase">S.A.H · 2025–2030</footer>';
  document.getElementById('root').innerHTML=h;
  
  bindForm();
  
  if(S.pickerOpen){
    const list=document.getElementById('picker-list');
    if(list){const sel=list.querySelector('[data-sel="1"]');if(sel)list.scrollTop=sel.offsetTop-list.clientHeight/2+sel.clientHeight/2;}
  }
}

function bindForm(){
  const kg=document.getElementById('f-kg'), kc=document.getElementById('f-kcal');
  function upd(){
    S.fKg=kg?kg.value:''; S.fKcal=kc?kc.value:'';
    const el=document.getElementById('preview');if(!el)return;
    const kgN=S.fKg?parseFloat(S.fKg.replace(',','.')):null;
    const kcN=S.fKcal?parseInt(S.fKcal):null;
    if(kgN==null&&kcN==null){el.innerHTML='';return;}
    const bak=S.data[S.formMonth];
    if(!S.data[S.formMonth])S.data[S.formMonth]={};
    S.data[S.formMonth]=Object.assign({},bak,{[S.formPerson]:{kg:kgN,kcal:kcN}});
    const e=computeEntry(S.formPerson,S.formMonth);
    S.data[S.formMonth]=bak;
    el.innerHTML='<span style="color:'+(e.pass?'var(--win)':'var(--loss)')+'">+'+(e.amount)+'€</span>';
  }
  if(kg)kg.addEventListener('input',upd);
  if(kc)kc.addEventListener('input',upd);

  const tt=document.getElementById('f-trip-title'), td=document.getElementById('f-trip-dates'), tc=document.getElementById('f-trip-cost');
  if(tt) tt.addEventListener('input', () => S.fTripTitle = tt.value);
  if(td) td.addEventListener('input', () => S.fTripDates = td.value);
  if(tc) tc.addEventListener('input', () => S.fTripCost = tc.value);
}

function openInlineEdit(el, currentVal, dec, isKcal, onCommit){
  if(el.querySelector('input'))return;
  const input=document.createElement('input');
  input.type='number'; input.inputMode=isKcal?'numeric':'decimal';
  input.className='editinput'+(isKcal?' sm':'');
  input.placeholder=isKcal?'kcal':'kg';
  input.value=currentVal!=null?currentVal:'';
  el.innerHTML=''; el.appendChild(input);
  input.focus(); input.select();
  let committed=false;
  const commit=()=>{
    if(committed)return; committed=true;
    const n=parseFloat(input.value.replace(',','.'));
    onCommit(input.value.trim()===''?null:(isNaN(n)?null:+n.toFixed(dec)));
  };
  input.addEventListener('blur',commit);
  input.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();commit();}if(e.key==='Escape'){committed=true;render();}});
}

function setPath(obj,path,val){const p=path.split('.');let c=obj;for(let i=0;i<p.length-1;i++)c=c[p[i]];c[p[p.length-1]]=val;}

document.addEventListener('click',ev=>{
  const t=ev.target.closest('[data-act]');
  if(!t)return;
  const act=t.getAttribute('data-act');

  if(act === 'pin-key') {
    if(!S.pinEntry) S.pinEntry = '';
    if(S.pinEntry.length < 5) {
      S.pinEntry += t.getAttribute('data-val');
      updateDots();
      if(S.pinEntry.length === 5) {
        S.pin = S.pinEntry;
        localStorage.setItem('getfit_pin', S.pin);
        S.pinLoading = true;
        render();
        syncLoad();
      }
    }
    return;
  }
  
  if(act === 'pin-del') {
    if(S.pinEntry && S.pinEntry.length > 0) {
      S.pinEntry = S.pinEntry.slice(0, -1);
      updateDots();
    }
    return;
  }

  if(act==='toggle-year'){
    const yr=t.getAttribute('data-year');
    if(S.openYears.has(yr)) S.openYears.delete(yr); else S.openYears.add(yr);
    render();return;
  }

  if(act==='tab'){S.tab=t.getAttribute('data-val');S.pickerOpen=false;render();return;}
  if(act==='fperson'){S.formPerson=t.getAttribute('data-val');render();return;}
  
  if(act==='picker'){S.pickerOpen=!S.pickerOpen;render();return;}
  if(act==='picker-bg'){S.pickerOpen=false;render();return;}
  if(act==='pick'){S.formMonth=t.getAttribute('data-val');S.pickerOpen=false;render();return;}

  if(act==='add'){
    const kgEl=document.getElementById('f-kg'),kcEl=document.getElementById('f-kcal');
    const kgN=kgEl&&kgEl.value?parseFloat(kgEl.value.replace(',','.')):null;
    const kcN=kcEl&&kcEl.value?parseInt(kcEl.value):null;
    if (kgN == null && kcN == null) return;
    
    const key=S.formMonth,p=S.formPerson;
    if(!S.data[key])S.data[key]={};
    S.data[key]=Object.assign({},S.data[key],{[p]:{kg:kgN,kcal:kcN}});
    if(S.manual[key]&&S.manual[key][p]!==undefined){delete S.manual[key][p];}
    S.fKg='';S.fKcal='';
    const ch=makeChange(p,key,kgN,kcN,'form entry');
    S.openYears.add(key.split('-')[0]);
    scheduleSave([ch]);
    render();return;
  }

  if(act==='add-trip'){
    const titleEl=document.getElementById('f-trip-title');
    const datesEl=document.getElementById('f-trip-dates');
    const costEl=document.getElementById('f-trip-cost');
    
    const titleVal = titleEl ? titleEl.value.trim() : '';
    const datesVal = datesEl ? datesEl.value.trim() : '';
    const costVal = costEl && costEl.value ? parseFloat(costEl.value.replace(',','.')) : null;

    if (titleVal && costVal != null) {
      if(!S.trips) S.trips = [];
      S.trips.push({ title: titleVal, dates: datesVal, cost: costVal });
      S.fTripTitle=''; S.fTripDates=''; S.fTripCost='';
      scheduleSave([]);
      render();
    }
    return;
  }

  if(act==='del-trip'){
    const idx = parseInt(t.getAttribute('data-idx'));
    if(S.trips && S.trips[idx] !== undefined) {
      S.trips.splice(idx, 1);
      scheduleSave([]);
      render();
    }
    return;
  }

  if(act==='toggle'){
    const key=t.getAttribute('data-month'),p=t.getAttribute('data-person');
    const e=amountFor(p,key);if(!e)return;
    const nv=e.amount===S.config.stakes.success?S.config.stakes.failure:S.config.stakes.success;
    if(!S.manual[key])S.manual[key]={};
    S.manual[key][p]=nv;
    const d=(S.data[key]&&S.data[key][p])||{};
    const ch={month:key,person:p,kg:d.kg??null,kcal:d.kcal??null,pass:nv===S.config.stakes.success,amount:nv,note:'manual override'};
    scheduleSave([ch]);
    render();return;
  }

  if(act==='editcell'){
    const key=t.getAttribute('data-month'),p=t.getAttribute('data-person'),field=t.getAttribute('data-field');
    const curStr=t.getAttribute('data-val');
    const cur=curStr!==''?parseFloat(curStr):null;
    openInlineEdit(t,cur,field==='kg'?2:0,field==='kcal',(val)=>{
      if(!S.data[key])S.data[key]={};
      if(!S.data[key][p])S.data[key][p]={kg:null,kcal:null};
      S.data[key][p][field]=val;
      const d=S.data[key][p];
      const ch=makeChange(p,key,d.kg,d.kcal,'inline edit '+field);
      scheduleSave([ch]);
      render();
    });
    return;
  }

  if(act==='editnum'){
    const path=t.getAttribute('data-path'),dec=+t.getAttribute('data-dec');
    const cur=parseFloat(t.textContent.trim());
    openInlineEdit(t,cur,dec,path.includes('kcal'),(val)=>{
      if(val!=null)setPath(S.config,path,val);
      scheduleSave([]);
      render();
    });
    return;
  }
});

["2026-06"].forEach(k=>{
  if(S.data[k]){delete S.data[k];persist();}
  if(S.manual[k]){delete S.manual[k];persist();}
});

render();
syncLoad();
</script>
